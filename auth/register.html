<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Tạo tài khoản ZHosting"><title>Đăng ký — ZHosting</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body class="auth-page"><main class="auth-shell"><a class="brand auth-brand" href="../index.html"><span class="brand-mark">Z</span><span>Z<span class="accent">Hosting</span></span></a><section class="auth-card"><span class="eyebrow">CREATE ACCOUNT</span><h1>Tạo tài khoản.</h1><p>Lưu hồ sơ cá nhân và quản lý dịch vụ trong một nơi.</p><form id="registerForm" novalidate><label>Họ và tên<input id="registerName" type="text" autocomplete="name" required placeholder="Nguyễn Văn A"></label><label>Email<input id="registerEmail" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Mật khẩu<input id="registerPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Tối thiểu 8 ký tự"></label><label>Xác nhận mật khẩu<input id="registerConfirm" type="password" autocomplete="new-password" minlength="8" required placeholder="Nhập lại mật khẩu"></label><button class="btn btn-primary full" type="submit">Tạo tài khoản <span>→</span></button><p class="form-note" id="registerMessage" role="status"></p></form><div class="auth-divider"><span>đã có tài khoản?</span></div><a class="btn btn-ghost full" href="login.html">Đăng nhập</a></section><p class="auth-foot">Thông tin hồ sơ demo được lưu cục bộ trên trình duyệt.</p></main><script src="../assets/js/auth.js"></script></body></html>
